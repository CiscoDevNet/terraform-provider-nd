  # Inventory-specific test configuration
  inventory:
    fabric: test_fabric_vxlan
    user: admin
    pwd: "password"
    mode: discovery
    max_hop: 0
    preserve_config: false
    deploy: true
    recalculate: true
    # Discovery mode switches
    discovery_switches:
      - serial: "SERIAL001"
        ip: "10.0.0.1"
        role: "spine"
      - serial: "SERIAL002"
        ip: "10.0.0.2"
        role: "leaf"
      - serial: "SERIAL003"
        ip: "10.0.0.3"
