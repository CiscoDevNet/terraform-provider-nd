    # Bootstrap mode switches
    bootstrap_switches:
      - serial: "SERIAL001"
        ip: "10.0.0.1"
        role: "spine"
        hostname: "spine1"
        gateway_ip_mask: "10.0.0.254/24"
        poap_password: "password"
      - serial: "SERIAL002"
        ip: "10.0.0.2"
        role: "leaf"
        hostname: "leaf1"
        gateway_ip_mask: "10.0.0.254/24"
        poap_password: "password"

