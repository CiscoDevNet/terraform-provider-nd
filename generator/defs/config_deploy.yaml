resource:
  name: config_deploy
  generate_tf_resource: true
  skip_equality: true
  category: manage
  description: >
    Triggers fabric configuration save (recalculate) and/or deployment operations
    on an ND-managed fabric. This is an action resource — it executes config-save
    and deploy operations rather than managing a persistent API object.
  attributes:
  - model_name: id
    tf_name: id
    description: The unique identifier of the config_deploy resource
    type: String
    computed: true
    use_state: true

  - model_name: fabricName
    tf_name: fabric_name
    description: Name of the fabric to perform config-save and/or deploy on
    type: String
    mandatory: true
    tf_requires_replace: true
    example: my_fabric

  - model_name: deploy
    tf_name: deploy
    description: >
      When true, deploy the fabric configuration to switches.
      Can be used independently or together with `config_save`.
      At least one of `deploy` or `config_save` must be true.
    type: Bool
    ndfc_type: bool
    default_value: false
    payload_hide: true
    example: true

  - model_name: configSave
    tf_name: config_save
    description: >
      When true, perform a config-save (recalculate) operation on the fabric.
      Can be used independently or together with `deploy`.
      When both are true, config-save runs first. Also known as recalculate in the API.
    type: Bool
    ndfc_type: bool
    default_value: false
    payload_hide: true
    example: true

  - model_name: switchIds
    tf_name: switch_ids
    description: >
      List of switch serial numbers/IP addresses to deploy configuration to.
      Both IP addresses and serial numbers are accepted.
      Use `["ALL"]` or omit to perform a fabric-wide deploy.
    type: List:String
    optional: true
    payload_hide: true
    example: '["ALL"]'

  - model_name: forceShowRun
    tf_name: force_show_run
    description: >
      When true, fetch the latest running configuration from each switch
      instead of using the cached version before deployment.
    type: Bool
    ndfc_type: bool
    default_value: false
    payload_hide: true
    example: false

  - model_name: inclAllFabricGroupsSwitches
    tf_name: include_all_fabric_group_switches
    description: >
      When true and the target is a fabric group, deploy changes to switches
      in all member fabrics. Only applicable for fabric-wide deploy.
    type: Bool
    ndfc_type: bool
    default_value: false
    payload_hide: true
    example: false

  - model_name: alwaysExecute
    tf_name: always_execute
    description: >
      When true, force the resource to show as an update on every `terraform apply`,
      ensuring that the `behaviour.execute_on_update` logic runs on every apply.
      Internally, Read resets this to false in state so Terraform always detects a diff.
      When false (default), the resource settles after initial creation and only
      re-executes when other attributes change.
    type: Bool
    ndfc_type: bool
    default_value: false
    payload_hide: true
    example: false

  - model_name: behaviour
    tf_name: behaviour
    description: >
      Controls when the config-save and deploy operations are executed
      during the Terraform resource lifecycle.
      Note that setting all controls to false will make this resource a no-op.
    type: Struct
    payload_hide: true
    default_value: true
    attributes:
    - model_name: onCreate
      tf_name: execute_on_create
      description: >
        When true, execute config-save and/or deploy when the resource is created.
        When false, resource creation only writes Terraform state without performing any operations on ND.
      type: Bool
      ndfc_type: bool
      default_value: true

    - model_name: onUpdate
      tf_name: execute_on_update
      description: >
        When true, execute config-save and/or deploy when the resource is updated.
        Commonly used with `always_execute = true` to re-execute on every apply.
      type: Bool
      ndfc_type: bool
      default_value: true

    - model_name: onDestroy
      tf_name: execute_on_destroy
      description: >
        When true, execute config-save and/or deploy when the resource is destroyed.
        Useful for deploying configuration removal to switches.
        This flag is read from Terraform state, not from the current configuration.
        If you change this from false to true, you must run `terraform apply` before
        `terraform destroy` so the new value is persisted to state.
      type: Bool
      ndfc_type: bool
      default_value: false

  - model_name: status
    tf_name: status
    description: >
      Status message from the last config-save and/or deploy operation.
      Read-only, assembled from API responses after the operation completes.
      When behaviour flags skip execution, this field is unset.
    type: String
    computed: true

  - model_name: ticketId
    tf_name: ticket_id
    description: >
      Change Control ticket ID to associate with the config-save operation.
      Must begin with a letter; remaining characters may be letters, numbers,
      underscores, or hyphens. Length: 1–64 characters.
    type: String
    optional: true
    payload_hide: true
    example: Ticket_001
