        optional: true
        example: '["0"]'
      - model_name: pathCost
        tf_name: path_cost
        type: Int64
        description: Spanning tree port path cost (1-200000000).
        optional: true
        example: 1

    - model_name: mstPortPrioList
      tf_name: mst_port_prio_list
      description: MST instance lists with different port priorities.
      type: List
      optional: true
