    # --- Array-of-object attributes ---

    - model_name: associationList
      tf_name: association_list
      description: Private VLAN host association. Each entry pairs a primary VLAN (pVlan) with a secondary VLAN (sVlan).
      type: List
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      attributes:
