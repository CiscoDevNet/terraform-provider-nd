        optional: true
        example: 100
      - model_name: sVlan
        tf_name: s_vlan
        type: Int64
        description: Secondary VLAN ID for private VLAN isolation (1-4094).
        optional: true
        example: 200

    - model_name: mappingList
      tf_name: mapping_list
      description: Private VLAN promiscuous mapping. Each entry maps a primary VLAN (pVlan) to a secondary VLAN (sVlan).
      type: List
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
