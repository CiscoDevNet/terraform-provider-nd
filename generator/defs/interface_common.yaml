---
# Feature 001 — common model for all nd_interface_* resources.
#
# This file is the shared Go payload definition. It generates
# NDFCInterfaceCommonModel in internal/manage/resource_interface_common,
# which per-type resources (nd_interface_ethernet, ...) parent via
# parent_package / parent_model.
#
# Nesting decision (feature 001 open-point, approved by reviewer 2026-10-15):
# the TF plugin framework cannot represent a user-declared sub-Struct inside
# a Map element (sub-objects become basetypes.ObjectValue with no .SetValue).
# We therefore FLATTEN the policy block: every policy scalar lives directly
# on the Map element and carries ndfc_nested: [configData, networkOS, policy].
# The user-facing HCL loses the `policy = { ... }` block from the spec example.
#
# Attribute scope: feature 001 lands only the foundation attributes needed to
# describe any ethernet policy (mode, network_os_type, policy_type, admin_state,
# description, mtu, plus templateName/templateConfig for userDefined). The full
# 65-scalar ethernet union lands in feature 002 (expands this file + the
# per-type interface_ethernet.yaml in lockstep).
resource:
  name: interface_common
  generate_tf_resource: false
  inherited_model: true
  skip_equality: false
  category: manage
  attributes:
  - model_name: id
    tf_name: id
    description: The unique identifier of the nd_interface resource. Format
      `<fabric_name>/<switch_id>/<interface_names csv>`.
    type: String
    computed: true
    payload_hide: true
  - model_name: fabricName
    tf_name: fabric_name
    description: The name of the fabric that owns the interfaces
    type: String
    mandatory: true
    tf_requires_replace: true
    payload_hide: true
    example: Trial_VXLAN
  - model_name: switchId
    tf_name: switch_id
    description: Default switch serial number or management IP address applied to
      all interface entries. Accepts either a serial or an IP; IPs are resolved
      internally. Mutually exclusive with per-interface switch_id — set it here
      or on each interface entry, not both.
    type: String
    optional: true
    tf_requires_replace: true
    payload_hide: true
    example: FDO22412H7U
  - model_name: deploy
    tf_name: deploy
    description: When true, deploy the interface configuration to the switches
      after create or update via /fabrics/{f}/interfaceActions/deploy.
    type: Bool
    ndfc_type: bool
    default_value: "false"
    payload_hide: true
    example: true
  - model_name: interfaces
    tf_name: interfaces
    description: Map of interfaces keyed by interface name.
    type: Map
    mandatory: true
    bulk: true
    attributes:
    - model_name: interfaceName
      tf_name: interface_name
      description: Interface name (populated from the map key)
      type: String
      tf_hide: true
      example: Ethernet1/13
    - model_name: interfaceType
      tf_name: interface_type
      description: Interface type (fixed per resource; populated by the backend)
      type: String
      tf_hide: true
      example: ethernet
    - model_name: switchId
      tf_name: switch_id
      description: Switch serial number or management IP address owning this
        interface. Mutually exclusive with resource-level switch_id — set it
        on each interface entry or at the resource level, not both.
      type: String
      optional: true
      computed: true
      use_state: true
      requires_replace: true
    - model_name: mode
      tf_name: mode
      description: Interface operational mode. Allowed values depend on the
        interface type (e.g. access/trunk/routed/pvlan/dot1qTunnel/managed/
        unmanaged for ethernet).
      type: String
      mandatory: true
      requires_replace: true
      ndfc_nested:
      - configData
      example: access
    - model_name: networkOSType
      tf_name: network_os_type
      description: Network operating system of the switch (nx-os, ios-xe, ios-xr).
        Allowed values depend on the interface type and mode.
      type: String
      mandatory: true
      requires_replace: true
      ndfc_nested:
      - configData
      - networkOS
      example: nx-os
    - model_name: policyType
      tf_name: policy_type
      description: Built-in policy type for the (interface_type, mode, network_os_type)
        combination, or `userDefined` to select a custom template via template_name.
      type: String
      mandatory: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: accessHost
    - model_name: templateName
      tf_name: template_name
      description: Name of the user-defined template. Required when
        policy_type is `userDefined`; must be null otherwise.
      type: String
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: my_custom_template
    - model_name: templateConfig
      tf_name: template_config
      description: Name/value pairs defined by the selected user-defined template.
        Only valid when policy_type is `userDefined`.
      type: Map:String
      optional: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: '{"ADMIN_STATE" = "true", "SPEED" = "Auto"}'
    - model_name: adminState
      tf_name: admin_state
      description: Administrative state. Uncheck to disable the interface.
      type: Bool
      ndfc_type: bool
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: true
    - model_name: description
      tf_name: description
      description: Free-form description applied to the interface config.
      type: String
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: access port for lab host
    - model_name: mtu
      tf_name: mtu
      description: MTU of the interface. The wire representation is template-
        dependent — a JSON integer for L3/ios-xe templates (e.g. 1500..9216) and
        a JSON string enum (`default`|`jumbo`) for nx-os L2 templates. Exposed as
        a String; the dual-form marshal lives in resource_custom_codec.go.
      type: String
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: default
    - model_name: extraConfig
      tf_name: extra_config
      description: Additional raw configuration appended to the interface.
      type: String
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: logging event port link-status
    - model_name: accessVlan
      tf_name: access_vlan
      description: VLAN for this access port.
      type: Int64
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: 100
    - model_name: allowedVlans
      tf_name: allowed_vlans
      description: 'Allowed VLANs. Use ''none'', ''all'', or specify VLAN ranges such
        as 1-200, 500-2000, 3000.'
      type: String
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: none
    - model_name: bandwidth
      tf_name: bandwidth
      description: Configure the bandwidth value for this interface.
      type: Int64
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: 1000
    - model_name: bandwidthCapacityPercent
      tf_name: bandwidth_capacity_percent
      description: Percentage of bandwidth capacity for this interface.
      type: Int64
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: 50
    - model_name: borderRouter
      tf_name: border_router
      description: Indicates if the interface is a boundary of a PIM-SM domain.
      type: Bool
      ndfc_type: bool
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: false
    - model_name: bpduFilter
      tf_name: bpdu_filter
      description: Configure spanning-tree bpdu filter (enable/disable/default).
      type: String
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: default
    - model_name: bpduGuard
      tf_name: bpdu_guard
      description: Enable or disable spanning-tree bpdu guard (enable/disable/default).
      type: String
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: enable
    - model_name: cdp
      tf_name: cdp
      description: Enable Cisco Discovery Protocol (CDP) on the interface.
      type: Bool
      ndfc_type: bool
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: true
    - model_name: debounceLinkupTimer
      tf_name: debounce_linkup_timer
      description: Debounce timer for link-up transitions (1000..10000).
      type: Int64
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: 1000
    - model_name: debounceTimer
      tf_name: debounce_timer
      description: Debounce timer (0..20000).
      type: Int64
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: 100
    - model_name: duplexMode
      tf_name: duplex_mode
      description: Port duplex mode (auto/full/half).
      type: String
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: auto
    - model_name: errorDetectionAcl
      tf_name: error_detection_acl
      description: Enable error detection for access-list installation failures.
      type: Bool
      ndfc_type: bool
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: true
    - model_name: fec
      tf_name: fec
      description: Forward error correction mode (auto/fcFec/off/rsCons16/rsFec/rsIEEE).
      type: String
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: auto
    - model_name: guardMode
      tf_name: guard_mode
      description: Spanning-tree guard mode (root/none/loop/delete).
      type: String
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: root
    - model_name: ifName
      tf_name: if_name
      description: Internal interface name selector used by csr_multisite_ifc_underlay.
      type: String
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: GigabitEthernet0
    - model_name: inheritBandwidth
      tf_name: inherit_bandwidth
      description: Sub-interfaces inherit this bandwidth value.
      type: Int64
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: 1000
    - model_name: ip
      tf_name: ip
      description: IP address of the interface.
      type: String
      optional: true
