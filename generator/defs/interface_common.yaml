      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: 10.1.1.1
    - model_name: ipRedirects
      tf_name: ip_redirects
      description: Disable IPv4 and IPv6 redirects on the interface.
      type: Bool
      ndfc_type: bool
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: false
    - model_name: ipv6
      tf_name: ipv6
      description: IPv6 address of the interface.
      type: String
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: 'fd00::1'
    - model_name: ipv6Prefix
      tf_name: ipv6_prefix
      description: Prefix length associated with the IPv6 address (64..127).
      type: Int64
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: 64
    - model_name: linkType
      tf_name: link_type
      description: Link type for spanning tree (auto/pointToPoint/shared).
      type: String
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: auto
    - model_name: mask
      tf_name: mask
      description: Subnet mask for the IP address (csr_multisite_ifc_underlay).
      type: String
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: 255.255.255.252
    - model_name: monitor
      tf_name: monitor
      description: Enable switchport monitoring for SPAN or ERSPAN.
      type: Bool
      ndfc_type: bool
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: false
    - model_name: nativeVlan
      tf_name: native_vlan
      description: Native VLAN for the interface (1..4094).
      type: Int64
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: 1
    - model_name: negotiateAuto
      tf_name: negotiate_auto
      description: Enable link auto-negotiation.
      type: Bool
      ndfc_type: bool
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: true
    - model_name: netflow
      tf_name: netflow
      description: Enable netflow collection (requires fabric netflow enabled).
      type: Bool
      ndfc_type: bool
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: false
    - model_name: netflowMonitor
      tf_name: netflow_monitor
      description: Layer 2 monitor name for netflow.
      type: String
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: NFMon
    - model_name: netflowSampler
      tf_name: netflow_sampler
      description: Netflow sampler name (N7K only).
      type: String
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: NFSamp
    - model_name: orphanPort
      tf_name: orphan_port
      description: Configure the interface as a VPC orphan port.
      type: Bool
      ndfc_type: bool
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: false
    - model_name: pathCost
      tf_name: path_cost
      description: Spanning-tree port path cost (1..200000000).
      type: Int64
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: 2000
    - model_name: pfc
      tf_name: pfc
      description: Enable priority flow control.
      type: Bool
      ndfc_type: bool
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: false
    - model_name: pimDrPriority
      tf_name: pim_dr_priority
      description: Priority for PIM DR election (1..4294967295).
      type: Int64
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: 1
    - model_name: pimSparse
      tf_name: pim_sparse
      description: Enable PIM sparse mode on the interface.
      type: Bool
      ndfc_type: bool
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: false
    - model_name: portChannelId
      tf_name: port_channel_id
      description: Port-channel identifier the member belongs to.
      type: String
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: '10'
    - model_name: portChannelMode
      tf_name: port_channel_mode
      description: Port-channel mode (on/active/passive/auto/desirable).
      type: String
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: active
    - model_name: portTypeEdgeTrunk
      tf_name: port_type_edge_trunk
      description: Enables spanning-tree edge port (PortFast) behaviour.
      type: Bool
      ndfc_type: bool
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: true
    - model_name: prefix
      tf_name: prefix
      description: Netmask length for the IP address. Represented as String —
        serialised as a JSON integer in L3/ios-xe templates and as a JSON string
        in a subset of templates. Dual-form marshaling in resource_custom_codec.go.
      type: String
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: '30'
    - model_name: ptp
      tf_name: ptp
      description: Enable precision time protocol (PTP) on the interface.
      type: Bool
      ndfc_type: bool
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: false
    - model_name: ptpProfile
      tf_name: ptp_profile
      description: PTP profile (ieee1588v2/smpte20592/aes672015).
      type: String
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: smpte20592
    - model_name: ptpRole
      tf_name: ptp_role
      description: Set PTP role to primary-only.
      type: Bool
      ndfc_type: bool
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: false
    - model_name: ptpVlan
      tf_name: ptp_vlan
      description: VLAN for PTP traffic (1..4094).
      type: Int64
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: 100
    - model_name: pvlanAllowedVlans
      tf_name: pvlan_allowed_vlans
      description: Private-VLAN allowed VLANs (none or ranges).
      type: String
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: none
    - model_name: pvlanMode
      tf_name: pvlan_mode
      description: Private-VLAN mode (promiscuous/trunkPromiscuous/host/trunkSecondary).
      type: String
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: host
    - model_name: pvlanNativeVlan
      tf_name: pvlan_native_vlan
      description: Native VLAN on a promiscuous PVLAN port (1..4094).
      type: Int64
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: 1
    - model_name: qos
      tf_name: qos
      description: Enable a QoS policy for this interface.
      type: Bool
      ndfc_type: bool
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: false
    - model_name: qosPolicy
      tf_name: qos_policy
      description: Custom QoS policy name.
      type: String
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: QOSP
    - model_name: queuingPolicy
      tf_name: queuing_policy
      description: Queuing policy name.
      type: String
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: QPol
    - model_name: routingTag
      tf_name: routing_tag
      description: Routing tag associated with the interface IP. Represented as
        String — JSON integer in some templates (0..4294967295), JSON string in
        ipfm templates. Dual-form marshaling in resource_custom_codec.go.
      type: String
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: '12345'
    - model_name: securityGroupProxy
      tf_name: security_group_proxy
      description: Enable host group proxy functionality.
      type: Bool
      ndfc_type: bool
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: false
    - model_name: speed
      tf_name: speed
      description: Speed setting (auto, 10Mb..800Gb depending on template).
      type: String
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: auto
    - model_name: stormControl
      tf_name: storm_control
      description: Configure storm control on this interface.
      type: Bool
      ndfc_type: bool
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: false
    - model_name: stormControlAction
      tf_name: storm_control_action
      description: Storm-control action (shutdown/trap/default).
      type: String
      optional: true
      computed: true
      use_state: true
