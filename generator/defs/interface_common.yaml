    - model_name: stormControlMulticastLevel
      tf_name: storm_control_multicast_level
      description: Multicast storm-control level (percentage).
      type: Float64
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: 10.5
    - model_name: stormControlMulticastLevelPps
      tf_name: storm_control_multicast_level_pps
      description: Multicast storm-control level (packets per second).
      type: Int64
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: 100000
    - model_name: stormControlUnicastLevel
      tf_name: storm_control_unicast_level
      description: Unicast storm-control level (percentage).
      type: Float64
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: 10.5
    - model_name: stormControlUnicastLevelPps
      tf_name: storm_control_unicast_level_pps
      description: Unicast storm-control level (packets per second).
      type: Int64
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
