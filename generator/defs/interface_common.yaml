      - configData
      - networkOS
      - policy
      example: default
    - model_name: stormControlBroadcastLevel
      tf_name: storm_control_broadcast_level
      description: Broadcast storm-control level (percentage).
      type: Float64
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      example: 10.5
    - model_name: stormControlBroadcastLevelPps
      tf_name: storm_control_broadcast_level_pps
      description: Broadcast storm-control level (packets per second).
      type: Int64
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
