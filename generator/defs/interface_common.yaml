        optional: true
        example: 239.1.1.0
      - model_name: prefix
        tf_name: prefix
        type: Int64
        description: Subnet mask length (4-32).
        optional: true
        example: 24

    - model_name: mstPathCostList
      tf_name: mst_path_cost_list
      description: MST instance lists (0-4094) with different port path costs.
      type: List
      optional: true
      computed: true
      use_state: true
      ndfc_nested:
      - configData
      - networkOS
      - policy
      attributes:
      - model_name: mstInstanceList
        tf_name: mst_instance_list
