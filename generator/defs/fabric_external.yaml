      type: String
      default_value: TAInterfaceRule1
      example: TAInterfaceRule1
    - model_name: interfaceCollection
      tf_name: interface_rule_interface_collection
      type: List
      attributes:
      - model_name: switchId
        tf_name: interface_rule_switch_id
        type: String
        example: FDO250703ZU
      - model_name: switchName
        tf_name: interface_rule_switch_name
        type: String
        example: N9K-leaf1
      - model_name: vrfName
        tf_name: interface_rule_vrf_name
        type: String
        example: vrf1
      - model_name: interfaces
        tf_name: interface_rule_interfaces
        type: List
        attributes:
        - model_name: name
          tf_name: interface_rule_interface_name
          type: String
          example: eth1/1
        - model_name: type
          tf_name: interface_rule_interface_type
          type: String
          default_value: routed
          example: routed
        - model_name: encap
          tf_name: interface_rule_interface_encap
          type: String
          example: vlan-100
        - model_name: vrfName
          tf_name: interface_rule_interface_vrf_name
          type: String
          example: vrf1
      - model_name: tenant
        tf_name: interface_rule_tenant
        type: String
        example: tenant1
      - model_name: l3Out
        tf_name: interface_rule_l3_out
        type: String
        example: L3Out1
    - model_name: enabled
      tf_name: interface_rule_enabled
      type: Bool
      default_value: true
      example: true
