  # --- externalStreamingSettings section ---

  - model_name: email
    tf_name: email
    type: List
    description: List of email settings
    ndfc_nested:
    - externalStreamingSettings
    attributes:
    - model_name: name
      tf_name: name
      type: String
      example: rule1
      description: Name of the email configuration. Identifies this specific
        email notification configuration
    - model_name: receiverEmail
      tf_name: receiver_email
      type: String
      example: example@example.com
      description: Email address to receive alerts
    - model_name: format
      tf_name: format
      type: String
      example: html
      description: "Email format. Can be 'html' or 'text' to specify the format
        of email alerts"
    - model_name: startDate
      tf_name: start_date
      type: String
      example: '2023-01-01T00:00:00Z'
      description: Start date for email alerts
    - model_name: collectionFrequencyInDays
      tf_name: collection_frequency_in_days
      type: Int64
      example: 42
      description: Frequency of email alerts in days
    - model_name: collectionType
      tf_name: collection_type
      type: String
      ndfc_nested:
      - collectionSettings
      example: basic
      description: Data collection type for message bus
    - model_name: anomalies
      tf_name: anomalies
      type: List:String
      ndfc_nested:
      - collectionSettings
      example: '["critical"]'
    - model_name: advisories
      tf_name: advisories
      type: List:String
      ndfc_nested:
      - collectionSettings
      example: '["critical"]'
    - model_name: riskAndConformanceReports
      tf_name: risk_and_conformance_reports
      type: List:String
      ndfc_nested:
      - collectionSettings
      example: '["software"]'
    - model_name: onlyIncludeActiveAlerts
      tf_name: only_include_active_alerts
      type: Bool
      ndfc_type: bool
      example: false
      description: When true, the output will only include alerts that are active
  - model_name: servers
    tf_name: syslog_servers
    type: List:String
    optional: true
    computed: true
    ndfc_nested:
    - externalStreamingSettings
    - syslog
    description: Syslog servers to which alerts are sent
  - model_name: facility
    tf_name: syslog_facility
    type: String
    optional: true
    computed: true
    ndfc_nested:
    - externalStreamingSettings
    - syslog
    description: Syslog servers facility
  - model_name: anomalies
    tf_name: syslog_anomalies
    type: List:String
    optional: true
    computed: true
    ndfc_nested:
    - externalStreamingSettings
    - syslog
    - collectionSettings
    description: Level of anomalies to be collected
  - model_name: messageBus
    tf_name: message_bus
    type: List
    ndfc_nested:
