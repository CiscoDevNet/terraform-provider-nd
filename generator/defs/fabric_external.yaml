    - model_name: enableFabricInterconnect
      tf_name: interface_rule_enable_fabric_interconnect
      type: Bool
      default_value: true
      example: true
      ndfc_type: bool
    - model_name: enableL3Out
      tf_name: interface_rule_enable_l3_out
      type: Bool
      default_value: true
      example: true
      ndfc_type: bool
    - model_name: uuid
      tf_name: interface_rule_uuid
      type: String
      example: 67b140d39bbd5b6f18af0af8
    - model_name: subnets
      tf_name: interface_rule_subnets
