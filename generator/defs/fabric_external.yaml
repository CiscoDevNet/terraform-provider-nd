  - model_name: udpCategorization
    tf_name: udp_categorization_support
    type: String
    optional: true
    computed: true
    ndfc_nested:
    - telemetrySettings
    - flowCollection
    description: Configuration status of Traffic Analytics UDP Categorization in
      a fabric
  - model_name: microburst
    tf_name: microburst
    type: Bool
    optional: true
    computed: true
