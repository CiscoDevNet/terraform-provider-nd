      tf_name: collection_type
      type: String
      example: alertsAndEvents
    - model_name: collectionType
      tf_name: collection_settings_collection_type
      type: String
      ndfc_nested:
      - collectionSettings
      example: basic
    - model_name: anomalies
      tf_name: anomalies
      type: List:String
      ndfc_nested:
      - collectionSettings
      example: '["critical"]'
    - model_name: advisories
      tf_name: advisories
      type: List:String
      ndfc_nested:
      - collectionSettings
      example: '["critical"]'
    - model_name: statistics
      tf_name: statistics
      type: List:String
      ndfc_nested:
      - collectionSettings
      example: '["interfaces"]'
    - model_name: faults
      tf_name: faults
      type: List:String
      ndfc_nested:
