resource:
  name: inventory_switch
  generate_tf_resource: true
  skip_equality: false
  category: manage
  attributes:
  # Required - Fabric identifier
  - model_name: id
    tf_name: id
    description: Unique identifier for the inventory switch resource, could be serial, IP address.
    type: String
    computed: true
    use_state: true
  
  - model_name: fabricName
    tf_name: fabric_name
    description: Name of the fabric to add the switch to
    type: String
    mandatory: true
    example: my_fabric

  # Mode selection
  - model_name: mode
    tf_name: mode
    description: "Operation mode for adding the switch. Allowed values: `discovery` (brownfield/greenfield via management IP) or `bootstrap` (zero-touch POAP provisioning)"
    type: String
    default_value: discovery
    example: discovery
    tf_requires_replace: true
  
  - model_name: seedIpCollection
    tf_name: seed_ip_collection
    type: List:String
    tf_hide: true

  - &preserveConfig
    model_name: preserveConfig
    tf_name: preserve_config
    description: "Preserve existing switch configuration. Set to `true` for brownfield (keep existing config) or `false` for greenfield (wipe config)"
    type: Bool
    ndfc_type: bool
    default_value: false
    tf_requires_replace: true
    example: true
  
  - model_name: wait_for_bootstrap
    tf_name: wait_for_bootstrap
    description: > 
      Bootstrap mode only. How long to wait for the switch to appear in the POAP list (e.g. `10m`, `60s`).
      When configured, Terraform will poll until the switch boots into POAP mode or the timeout expires.
      When not specified, the resource errors out immediately if the switch is not in the POAP list
    type: String
    payload_hide: true

  - model_name: wait_for_discover
    tf_name: wait_for_discover
    description: >
      Discovery mode only. How long to wait for the switch to become reachable during discovery (e.g. `10m`, `60s`).
      When configured, Terraform will retry shallow discovery until the switch is reachable or the timeout expires.
      When not specified, the resource errors out immediately if the switch is not reachable.
    type: String
    payload_hide: true
    example: "10m"

  - model_name: wait_for_ready
    tf_name: wait_for_ready
    type: String
    description: > 
      How long to wait for the switch to become manageable after adding to fabric (e.g. `10m`, `60s`).
      When configured, Terraform will poll the switch status until it is ready.
      If the switch is not ready within the timeout, the resource errors out.
    default_value: "30m"
    payload_hide: true
    example: "30m"

  # Switches map - key is serial number
  - model_name: switch_detail
    tf_name: switch_detail
    description: Switch identification and configuration details. `ip_address` is always required. `serial_number` is mandatory for bootstrap mode and optional for discovery mode (populated by NDFC after discovery if omitted)
    type: Struct
    mandatory: true
    payload_hide: true
    attributes:
    - model_name: hostname
      tf_name: hostname
      description: "Switch hostname. Required for bootstrap mode, optional for discovery (populated by NDFC if omitted)"
      type: String
      use_state: true
      computed: true
      optional: true
    
    - model_name: serialNumber
      tf_name: serial_number
      description: "Switch serial number. Either `serial_number` or `ip_address` is used to identify the switch. Populated by NDFC after discovery if omitted"
      type: String
      computed: true
      optional: true
      use_state: true

    - model_name: ip
      tf_name: ip_address
      unmarshal_tag: fabricManagementIp
      description: Switch management IP address used for discovery or bootstrap
      type: String
      mandatory: true
      example: "10.23.244.81"

    - model_name: model
      tf_name: model
      description: "Switch hardware model (e.g. `N9K-C93180YC-FX`). Read-only, populated by NDFC after discovery"
      type: String
      computed: true
      optional: true
      use_state: true
      example: N9K-C93180YC-FX

    - model_name: softwareVersion
      tf_name: software_version
      description: "Switch NX-OS software version (e.g. `10.3(3)`). Read-only, populated by NDFC after discovery"
      type: String
      computed: true
      optional: true
      use_state: true
      example: "10.3(3)"

    - model_name: softwareImage
      tf_name: software_image
      description: Software image filename for bootstrap (e.g. nxos64-cs.10.3.1.F.bin). When specified, this image is used during POAP bootstrap. When omitted, the value from the bootstrap list API is used.
      type: String
      computed: true
      optional: true
      use_state: true
      example: "nxos64-cs.10.3.1.F.bin"

    - model_name: switchRole
      tf_name: switch_role
      description: >
        Role of switch in fabric. Allowed values:
        `leaf`, `spine`, `border`, `borderGateway`, `borderSpine`,
        `borderGatewaySpine`, `borderSuperSpine`, `borderGatewaySuperSpine`,
        `superSpine`, `tier2Leaf`, `tor`, `access`, `aggregation`,
        `coreRouter`, `edgeRouter`.
      type: String
      default_value: leaf
      example: leaf
      enum_values:
        - border
        - borderGateway
        - borderGatewaySpine
        - borderGatewaySuperSpine
        - borderSpine
        - borderSuperSpine
        - leaf
        - spine
        - superSpine
        - tier2Leaf
        - tor
        - access
        - aggregation
        - coreRouter
        - edgeRouter
        - meta
        - neighbor

    - <<: *preserveConfig
      tf_hide: true

    - model_name: status
      tf_name: status
      description: "Current switch status as reported by NDFC (e.g. `ok`, `Manageable`, `Unreachable`). Read-only"
      type: String
      computed: true
      example: Manageable

    - model_name: statusReason
      tf_name: status_reason
      description: "Reason for current switch status when not healthy (e.g. failure details). Read-only"
      type: String
      computed: true

    # Bootstrap/POAP specific fields
    - model_name: gatewayIpMask
      tf_name: gateway_ip_mask
      description: "Gateway IP with subnet mask in CIDR notation (e.g. `10.1.1.1/24`). Required for bootstrap mode"
      type: String
      optional: true
      example: "10.1.1.1/24"

    - model_name: discoveryAuthProtocol
      tf_name: discovery_auth_protocol
      description: "Authentication protocol for POAP discovery. Allowed values: `MD5`, `SHA`, `MD5_DES`, `MD5_AES`, `SHA_DES`, `SHA_AES`"
      type: String
      optional: true
      example: md5


    - model_name: vdcId
      tf_name: vdc_id
      description: "Virtual Device Context (VDC) ID. Applicable only for Nexus 7000 series switches. Read-only"
      type: Int64
      computed: true
      optional: true
      use_state: true

    - model_name: vdcMac
      tf_name: vdc_mac
      description: "Virtual Device Context (VDC) MAC address. Applicable only for Nexus 7000 series switches. Read-only"
      type: String
      computed: true
      optional: true
      use_state: true

    #below variables are for different APIs

    - model_name: password
      tf_name: switch_password
      description: Password for bootstrap API payload (populated from top-level password)
      type: String
      tf_hide: true

    - model_name: ipAddress
      tf_name: ip_addr_bootstrap
      description: IP address for bootstrap payload
      type: String
      tf_hide: true
    
    - model_name: publicKey
      tf_name: public_key
      description: Public key for bootstrap
      type: String
      tf_hide: true

    - model_name: fingerPrint
      tf_name: fingerprint
      description: Fingerprint for bootstrap
      type: String
      tf_hide: true

    - model_name: inInventory
      tf_name: in_inventory
      description: Whether the switch is in inventory
      type: Bool
      ndfc_type: bool
      tf_hide: true

  - model_name: username
    tf_name: discovery_username
    description: >
      Username for switch discovery/login.
      In discovery mode, used as the switch login username.
      In bootstrap mode with use_new_credentials enabled, used as the post-bootstrap discovery username.
    type: String
    optional: true
    sensitive: true
    use_state: true
    example: admin

  - model_name: password
    tf_name: discovery_password
    description: >
      Password for switch discovery/login.
      In discovery mode, used as the switch login password.
      In bootstrap mode with use_new_credentials enabled, used as the post-bootstrap discovery password.
    type: String
    optional: true
    sensitive: true
    use_state: true
    example: mysecret

  - model_name: bootstrap_password
    tf_name: bootstrap_password
    description: >
      Admin password to set on the switch during POAP bootstrap.
      Required for bootstrap mode. Not used in discovery mode.
    type: String
    optional: true
    sensitive: true
    use_state: true
    payload_hide: true

  - model_name: use_new_credentials
    tf_name: use_new_credentials
    description: >
      Bootstrap mode only. When true, use discovery_username and discovery_password
      as separate credentials for post-bootstrap switch discovery.
      When false, the bootstrap admin password is used for discovery.
    type: Bool
    ndfc_type: bool
    default_value: false
    payload_hide: true

  - model_name: discovery_cred_for_lan
    tf_name: discovery_cred_for_lan
    description: >
      Discovery mode only. When true, use the discovery credentials as LAN
      credentials for config deployment (write) to the switch.
    type: Bool
    ndfc_type: bool
    default_value: true
    payload_hide: true

  - model_name: platformType
    tf_name: platform_type
    description: "Switch platform type (e.g. `nx-os`, `ios-xe`). Read-only, populated by NDFC after discovery"
    type: String
    computed: true

  - model_name: snmpV3AuthProtocol
    tf_name: snmp_v3_auth_protocol
    description: "SNMP v3 authentication protocol for switch discovery. Allowed values: `md5`, `sha`"
    type: String
    default_value: md5
    example: md5

  # Credential store
  - model_name: remoteCredentialStore
    tf_name: remote_credential_store
    description: "Credential store type for switch authentication. Allowed values: `local`, `cyberark`"
    type: String
    default_value: local
    example: local

  - model_name: remoteCredentialStoreKey
    tf_name: remote_credential_store_key
    description: Key identifier in the remote credential store. Required when `remote_credential_store` is set to `cyberark`
    type: String
    optional: true

  # Discovery source interface and VRF (update-only, read from additionalData)
  - model_name: sourceInterfaceName
    tf_name: source_interface_name
    description: "Discovery mode only. Source interface name for switch discovery (e.g. `mgmt0`, `Ethernet1/1`)"
    type: String
    optional: true
    payload_hide: true

  - model_name: sourceVrfName
    tf_name: source_vrf_name
    description: "Discovery mode only. Source VRF name for switch discovery (e.g. `management`, `default`)"
    type: String
    optional: true
    payload_hide: true

  # Discovery settings
  - model_name: maxHop
    tf_name: max_hop
    description: Maximum hops for CDP/LLDP discovery
    type: Int64
    tf_hide: true
