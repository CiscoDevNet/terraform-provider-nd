datasource:
  name: fabric
  generate_tf_resource: true
  skip_equality: true
  category: manage
  attributes:
  - model_name: id
    tf_name: id
    description: The unique identifier of the fabric
    type: String
    computed: true
    payload_hide: true
  - model_name: name
    tf_name: fabric_name
    description: The name of the fabric to read
    type: String
    mandatory: true
    validator: 'RegexMatches(regexp.MustCompile(`.*\S.*`), "must not be empty or whitespace")'
  - model_name: licenseTier
    tf_name: license_tier
    description: License Tier value of a fabric
    type: String
    computed: true
  - model_name: controller
    tf_name: controller_status
    ndfc_nested:
    - featureStatus
    description: The controller status of the fabric
    type: String
    computed: true
  - model_name: telemetry
    tf_name: telemetry_status
    ndfc_nested:
    - featureStatus
    description: The telemetry status of the fabric
    type: String
    computed: true
  - model_name: orchestration
    tf_name: orchestration_status
    ndfc_nested:
    - featureStatus
    description: The orchestration status of the fabric
    type: String
    computed: true
  - model_name: trapForwarder
    tf_name: trap_forwarder_status
    ndfc_nested:
    - featureStatus
    description: The trap forwarder status of the fabric
    type: String
    computed: true
  - model_name: telemetryCollection
    tf_name: telemetry_collection
    type: Bool
    ndfc_type: bool
    computed: true
    description: Enable telemetry collection
  - model_name: telemetryCollectionType
    tf_name: telemetry_collection_type
    type: String
    description: Telemetry collection method
    computed: true
  - model_name: telemetryStreamingProtocol
    tf_name: telemetry_streaming_protocol
    type: String
    description: Telemetry Streaming Protocol
    computed: true
  - model_name: telemetrySourceInterface
    tf_name: telemetry_source_interface
    type: String
    description: Telemetry Source Interface (VLAN id or Loopback id) only valid if
      Telemetry Collection is set to inBand
    computed: true
  - model_name: telemetrySourceVrf
    tf_name: telemetry_source_vrf
    type: String
    description: VRF over which telemetry is streamed, valid only if telemetry collection
      is set to inBand
    computed: true
  - model_name: securityDomain
    tf_name: security_domain
    type: String
    description: Security Domain associated with the fabric
    computed: true
  - model_name: allowedActions
    tf_name: allowed_actions
    type: List:String
    ndfc_nested:
    - meta
    description: Actions allowed on the listed fabrics
    computed: true
  - model_name: type
    tf_name: fabric_type
    type: String
    ndfc_nested:
    - management
    description: Type of NDFC fabric
    computed: true
  - model_name: bgpAsn
    tf_name: bgp_asn
    type: String
    ndfc_nested:
    - management
    description: Autonomous system number 1-4294967295 | 1-65535[.0-65535]
    computed: true
  - model_name: createBgpConfig
    tf_name: create_bgp_config
    type: Bool
    ndfc_type: bool
    ndfc_nested:
    - management
    description: Generate BGP configuration for core and edge routers
    computed: true
  - model_name: superSpineBgpAs
    tf_name: super_spine_bgp_as
    type: String
    ndfc_nested:
    - management
    description: BGP AS number for super spine switches 1-4294967295 | 1-65535[.0-65535]
    computed: true
  - model_name: leafBgpAs
    tf_name: leaf_bgp_as
    type: String
    computed: true
    ndfc_nested:
    - management
    description: BGP AS number for leaf switches 1-4294967295 | 1-65535[.0-65535]
  - model_name: borderBgpAs
    tf_name: border_bgp_as
    type: String
    computed: true
    ndfc_nested:
    - management
    description: BGP AS number for border switches 1-4294967295 | 1-65535[.0-65535]
  - model_name: bgpAsMode
    tf_name: bgp_as_mode
    type: String
    ndfc_nested:
    - management
    description: Multi-AS Unique ASN per Leaf/Border/Border Gateway (Borders and border
      gateways are allowed to share ASN). Same-Tier-AS Leafs share one ASN, Borders/border
      gateways share one ASN
    computed: true
  - model_name: bgpAsnAutoAllocation
    tf_name: bgp_asn_auto_allocation
    type: Bool
    ndfc_type: bool
    ndfc_nested:
    - management
    description: Enable automatic BGP ASN allocation from the bgpAsnRange pool
    computed: true
  - model_name: bgpAsnRange
    tf_name: bgp_asn_range
    type: String
    computed: true
    ndfc_nested:
    - management
    description: BGP ASN range for automatic ASN allocation (e.g. 65000-65535)
  - model_name: bgpAllowAsInNum
    tf_name: bgp_allow_as_in_num
    type: Int64
    computed: true
    ndfc_nested:
    - management
    description: Number of occurrences of the local AS number allowed in the BGP AS-path
  - model_name: bgpMaxPath
    tf_name: bgp_max_path
    type: Int64
    computed: true
    ndfc_nested:
    - management
    description: Maximum number of BGP equal-cost paths
  - model_name: bgpUnderlayFailureProtect
    tf_name: bgp_underlay_failure_protect
    type: Bool
    ndfc_type: bool
    ndfc_nested:
    - management
    description: Enable BGP underlay failure protection
    computed: true
  - model_name: autoConfigureEbgpEvpnPeering
    tf_name: auto_configure_ebgp_evpn_peering
    type: Bool
    ndfc_type: bool
    ndfc_nested:
    - management
    description: Automatically configure eBGP EVPN overlay peering between leaf and
      spine switches
    computed: true
  - model_name: allowLeafSameAs
    tf_name: allow_leaf_same_as
    type: Bool
    ndfc_type: bool
    ndfc_nested:
    - management
    description: Allow leaf switches to have the same BGP ASN even when AS mode is
      Multi-AS
    computed: true
  - model_name: assignIpv4ToLoopback0
    tf_name: assign_ipv4_to_loopback0
    type: Bool
    computed: true
    ndfc_type: bool
    ndfc_nested:
    - management
    description: In an IPv6 routed fabric or VXLAN EVPN fabric with IPv6 underlay,
      assign IPv4 address used for BGP Router ID to the routing loopback interface
  - model_name: targetSubnetMask
    tf_name: target_subnet_mask
    type: Int64
    computed: true
    ndfc_nested:
    - management
    description: Mask for underlay subnet IP range
  - model_name: anycastGatewayMac
    tf_name: anycast_gateway_mac
    type: String
    computed: true
    ndfc_nested:
    - management
    description: Shared anycast gateway MAC address for all VTEPs (xxxx.xxxx.xxxx)
  - model_name: performanceMonitoring
    tf_name: performance_monitoring
    type: Bool
    ndfc_type: bool
    ndfc_nested:
    - management
    description: Enable performance monitoring feature
    computed: true
  - model_name: replicationMode
    tf_name: replication_mode
    type: String
    computed: true
    ndfc_nested:
    - management
    description: Replication Mode for BUM Traffic
  - model_name: multicastGroupSubnet
    tf_name: multicast_group_subnet
    type: String
    computed: true
    ndfc_nested:
    - management
    description: Multicast pool prefix between 8 to 30. A multicast group ipv4 from
      this pool is used for BUM traffic for each overlay network
  - model_name: underlayMulticastGroupAddressLimit
    tf_name: underlay_multicast_group_address_limit
    type: Int64
    ndfc_nested:
    - management
    description: Underlay multicast group address limit. Valid values are 128 or 512
    computed: true
  - model_name: tenantRoutedMulticast
    tf_name: tenant_routed_multicast
    type: Bool
    ndfc_type: bool
    ndfc_nested:
    - management
    description: For Overlay ipv4 Multicast Support In VXLAN Fabrics
    computed: true
  - model_name: rendezvousPointCount
    tf_name: rendezvous_point_count
    type: Int64
    computed: true
    ndfc_nested:
    - management
    description: Number of spines acting as Rendezvous-Points (RPs)
  - model_name: category
    tf_name: category
    type: String
    description: Category name
    computed: true
  - model_name: location
    tf_name: location
    type: Struct
    computed: true
    attributes:
    - model_name: latitude
      tf_name: latitude
      type: Float64
      computed: true
      description: Latitude in decimal degrees
    - model_name: longitude
      tf_name: longitude
      computed: true
      type: Float64
      description: Longitude in decimal degrees
    description: Location to access the resource
  - model_name: alertSuspend
    tf_name: alert_suspend
    type: String
    description: Alert Suspend state configured on the fabric
    computed: true
  - model_name: rendezvousPointLoopbackId
    tf_name: rendezvous_point_loopback_id
    type: Int64
    ndfc_nested:
    - management
    description: Rendezvous Point (RP) loopback identifier
    computed: true
  - model_name: vpcPeerLinkVlan
    tf_name: vpc_peer_link_vlan
    type: String
    ndfc_nested:
    - management
    description: 'VLAN range (minimum: 2, maximum: 4094) for vPC Peer Link SVI'
    computed: true
  - model_name: vpcPeerLinkEnableNativeVlan
    tf_name: vpc_peer_link_enable_native_vlan
    type: Bool
    ndfc_type: bool
    ndfc_nested:
    - management
    description: Enable VpcPeer Link for Native Vlan
    computed: true
  - model_name: vpcPeerKeepAliveOption
    tf_name: vpc_peer_keep_alive_option
    type: String
    ndfc_nested:
    - management
    description: Use vPC Peer Keep Alive with Loopback or Management
    computed: true
  - model_name: vpcAutoRecoveryTimer
    tf_name: vpc_auto_recovery_timer
    type: Int64
    ndfc_nested:
    - management
    description: vPC auto recovery timer (in seconds)
    computed: true
  - model_name: vpcDelayRestoreTimer
    tf_name: vpc_delay_restore_timer
    type: Int64
    ndfc_nested:
    - management
    description: vPC delay restore timer (in seconds)
    computed: true
  - model_name: vpcPeerLinkPortChannelId
    tf_name: vpc_peer_link_port_channel_id
    type: String
    ndfc_nested:
    - management
    description: 'vPC Peer Link Port Channel ID (minimum: 1, maximum: 4096)'
    computed: true
  - model_name: vpcIpv6NeighborDiscoverySync
    tf_name: vpc_ipv6_neighbor_discovery_sync
    type: Bool
    ndfc_type: bool
    ndfc_nested:
    - management
    description: Enable IPv6 ND synchronization between vPC peers
    computed: true
  - model_name: advertisePhysicalIp
    tf_name: advertise_physical_ip
    type: Bool
    ndfc_type: bool
    ndfc_nested:
    - management
    description: For Primary VTEP IP Advertisement As Next-Hop Of Prefix Routes
    computed: true
  - model_name: vpcDomainIdRange
    tf_name: vpc_domain_id_range
    type: String
    ndfc_nested:
    - management
    description: 'vPC Domain ID range (minimum: 0, maximum: 1000) to use for new pairings'
    computed: true
  - model_name: bgpLoopbackId
    tf_name: bgp_loopback_id
    type: Int64
    ndfc_nested:
    - management
    description: Underlay Routing Loopback Id
    computed: true
  - model_name: allowSameLoopbackIpOnSwitches
    tf_name: allow_same_loopback_ip_on_switches
    type: Bool
    ndfc_type: bool
    ndfc_nested:
    - management
    description: Allow the same loopback IP address to be configured on multiple switches
      (e.g. RP loopback IP)
    computed: true
  - model_name: nveLoopbackId
    tf_name: nve_loopback_id
    type: Int64
    ndfc_nested:
    - management
    description: Underlay VTEP loopback Id associated with the Network Virtualization
      Edge (nve) interface
    computed: true
  - model_name: vrfTemplate
    tf_name: vrf_template
    type: String
    ndfc_nested:
    - management
    description: Default VRF Template
    computed: true
  - model_name: networkTemplate
    tf_name: network_template
    type: String
    ndfc_nested:
    - management
    description: Default Network Template
    computed: true
  - model_name: vrfExtensionTemplate
    tf_name: vrf_extension_template
    type: String
    ndfc_nested:
    - management
    description: Default Overlay VRF Template For Borders
    computed: true
  - model_name: networkExtensionTemplate
    tf_name: network_extension_template
    type: String
    ndfc_nested:
    - management
    description: Default Overlay Network Template For Borders
    computed: true
  - model_name: l3VniNoVlanDefaultOption
    tf_name: l3_vni_no_vlan_default_option
    type: Bool
    ndfc_type: bool
    ndfc_nested:
    - management
    description: L3 VNI configuration without VLAN configuration. This value is propagated
      on vrf creation as the default value of 'Enable L3VNI w/o VLAN' in vrf
    computed: true
  - model_name: siteId
    tf_name: site_id
    type: String
    computed: true
    ndfc_nested:
    - management
    description: For EVPN Multi-Site Support. Defaults to Fabric ASN
  - model_name: fabricMtu
    tf_name: fabric_mtu
    type: Int64
    ndfc_nested:
    - management
    description: Intra fabric interface MTU
    computed: true
  - model_name: l2HostInterfaceMtu
    tf_name: l2_host_interface_mtu
    type: Int64
    ndfc_nested:
    - management
    description: Layer 2 host interface MTU. Must be an even number
    computed: true
  - model_name: tenantDhcp
    tf_name: tenant_dhcp
    type: Bool
    ndfc_type: bool
    ndfc_nested:
    - management
    description: Enable Tenant DHCP
    computed: true
  - model_name: nxapi
    tf_name: nxapi
    type: Bool
    ndfc_type: bool
    ndfc_nested:
    - management
    description: Enable NX-API over HTTPS
    computed: true
  - model_name: nxapiHttpsPort
    tf_name: nxapi_https_port
    type: Int64
    ndfc_nested:
    - management
    description: HTTPS port for NX-API
    computed: true
  - model_name: nxapiHttp
    tf_name: nxapi_http
    type: Bool
    ndfc_type: bool
    ndfc_nested:
    - management
    description: Enable NX-API over HTTP
    computed: true
  - model_name: nxapiHttpPort
    tf_name: nxapi_http_port
    type: Int64
    ndfc_nested:
    - management
    description: HTTP port for NX-API
    computed: true
  - model_name: snmpTrap
    tf_name: snmp_trap
    type: Bool
    ndfc_type: bool
    ndfc_nested:
    - management
    description: Configure nexus dashboard as a receiver for SNMP traps
    computed: true
  - model_name: anycastBorderGatewayAdvertisePhysicalIp
    tf_name: anycast_border_gateway_advertise_physical_ip
    type: Bool
    ndfc_type: bool
    ndfc_nested:
    - management
    description: To advertise Anycast Border Gateway PIP as VTEP. Effective on MSD
      fabric 'Recalculate Config'
    computed: true
  - model_name: greenfieldDebugFlag
    tf_name: greenfield_debug_flag
    type: String
    ndfc_nested:
    - management
    description: Allow switch configuration to be cleared without a reload when preserveConfig
      is set to false
    computed: true
  - model_name: tcamAllocation
    tf_name: tcam_allocation
    type: Bool
    ndfc_type: bool
    ndfc_nested:
    - management
    description: TCAM commands are automatically generated for VxLAN and vPC Fabric
      Peering when Enabled
    computed: true
  - model_name: realTimeInterfaceStatisticsCollection
    tf_name: real_time_interface_statistics_collection
    type: Bool
    ndfc_type: bool
    ndfc_nested:
    - management
    description: Enable Real Time Interface Statistics Collection. Valid for NX-OS
      only
    computed: true
  - model_name: interfaceStatisticsLoadInterval
    tf_name: interface_statistics_load_interval
    type: Int64
    ndfc_nested:
    - management
    description: Interface Statistics Load Interval. Time in seconds
    computed: true
  - model_name: bgpLoopbackIpRange
    tf_name: bgp_loopback_ip_range
    type: String
    ndfc_nested:
    - management
    description: Typically Loopback0 IP Address Range
    computed: true
  - model_name: nveLoopbackIpRange
    tf_name: nve_loopback_ip_range
    type: String
    ndfc_nested:
    - management
    description: Typically Loopback1 IP Address Range
    computed: true
  - model_name: anycastRendezvousPointIpRange
    tf_name: anycast_rendezvous_point_ip_range
    type: String
    computed: true
    ndfc_nested:
    - management
    description: Anycast or Phantom RP IP Address Range
  - model_name: intraFabricSubnetRange
    tf_name: intra_fabric_subnet_range
    type: String
    computed: true
    ndfc_nested:
    - management
    description: Address range to assign numbered and peer link SVI IPs
  - model_name: l2VniRange
    tf_name: l2_vni_range
    type: String
    ndfc_nested:
    - management
    description: 'Overlay Network Identifier Range (minimum: 1, maximum: 16777214)'
    computed: true
  - model_name: l3VniRange
    tf_name: l3_vni_range
    type: String
    ndfc_nested:
    - management
    description: 'Overlay VRF Identifier Range (minimum: 1, maximum: 16777214)'
    computed: true
  - model_name: networkVlanRange
    tf_name: network_vlan_range
    type: String
    ndfc_nested:
    - management
    description: 'Per Switch Overlay Network VLAN Range (minimum: 2, maximum: 4094)'
    computed: true
  - model_name: vrfVlanRange
    tf_name: vrf_vlan_range
    type: String
    ndfc_nested:
    - management
    description: 'Used for Per VRF SVI Peering between Aggregation pairs (minimum:
      2, maximum: 4094)'
    computed: true
  - model_name: subInterfaceDot1qRange
    tf_name: sub_interface_dot1q_range
    type: String
    ndfc_nested:
    - management
    description: 'Per aggregation dot1q range (minimum: 2, maximum: 4093) for VRF-Lite
      connectivity'
    computed: true
  - model_name: vrfLiteAutoConfig
    tf_name: vrf_lite_auto_config
    type: String
    ndfc_nested:
    - management
    description: VRF Lite Aggregation-Core and Aggregation-Edge Router Inter-Fabric
      Connection Options
    computed: true
  - model_name: vrfLiteSubnetRange
    tf_name: vrf_lite_subnet_range
    type: String
    ndfc_nested:
    - management
    description: IPv4 address range to assign P2P Aggregation-Core connections, and
      peering between vPC Aggregation switches
    computed: true
  - model_name: vrfLiteSubnetTargetMask
    tf_name: vrf_lite_subnet_target_mask
    type: Int64
    ndfc_nested:
    - management
    description: IPv4 VRF Lite Subnet Mask Length
    computed: true
  - model_name: vrfLiteIpv6SubnetRange
    tf_name: vrf_lite_ipv6_subnet_range
    type: String
    computed: true
    ndfc_nested:
    - management
    description: IPv6 address range to assign P2P Aggregation-Core connections, and
      peering between vPC Aggregation switches
  - model_name: vrfLiteIpv6SubnetTargetMask
    tf_name: vrf_lite_ipv6_subnet_target_mask
    type: Int64
    ndfc_nested:
    - management
    description: IPv6 VRF Lite Subnet Mask Length
    computed: true
  - model_name: autoUniqueVrfLiteIpPrefix
    tf_name: auto_unique_vrf_lite_ip_prefix
    type: Bool
    ndfc_type: bool
    ndfc_nested:
    - management
    description: When enabled, IP prefix allocated to the VRF LITE IFC is not reused
      on VRF extension over VRF LITE IFC. Instead, unique IP Subnet is allocated for
      each VRF extension over VRF LITE IFC
    computed: true
  - model_name: perVrfLoopbackAutoProvision
    tf_name: per_vrf_loopback_auto_provision
    type: Bool
    ndfc_type: bool
    ndfc_nested:
    - management
    description: 'Auto provision an IPv4 loopback on a VTEP on VRF attachment. Note:
      Enabling this option auto-provisions loopback on existing VRF attachments and
      also when Edit, QuickAttach, or Multiattach actions are performed. Provisioned
      loopbacks cannot be deleted until VRFs are unattached'
    computed: true
  - model_name: perVrfLoopbackIpRange
    tf_name: per_vrf_loopback_ip_range
    type: String
    ndfc_nested:
    - management
    description: Prefix pool to assign IPv4 addresses to loopbacks on VTEPs on a per
      VRF basis
    computed: true
  - model_name: perVrfLoopbackAutoProvisionIpv6
    tf_name: per_vrf_loopback_auto_provision_ipv6
    type: Bool
    ndfc_type: bool
    ndfc_nested:
    - management
    description: Auto provision an IPv6 loopback on a VTEP on VRF attachment
    computed: true
  - model_name: perVrfLoopbackIpv6Range
    tf_name: per_vrf_loopback_ipv6_range
    type: String
    ndfc_nested:
    - management
    description: Prefix pool to assign IPv6 addresses to loopbacks on VTEPs on a per
      VRF basis
    computed: true
  - model_name: banner
    tf_name: banner
    type: String
    ndfc_nested:
    - management
    description: Message of the Day banner. Delimiter char (very first char is delimiter
      char) followed by message ending with delimiter
    computed: true
  - model_name: day0Bootstrap
    tf_name: day0_bootstrap
    type: Bool
    ndfc_type: bool
    ndfc_nested:
    - management
    description: Support day 0 touchless switch bringup
    computed: true
  - model_name: day0PlugAndPlay
    tf_name: day0_plug_and_play
    type: Bool
    ndfc_type: bool
    ndfc_nested:
    - management
    description: Enable Plug n Play for Catalyst 9000 switches
    computed: true
  - model_name: inbandDay0Bootstrap
    tf_name: inband_day0_bootstrap
    type: Bool
    ndfc_type: bool
    ndfc_nested:
    - management
    description: Support day 0 touchless switch bringup via inband management
    computed: true
  - model_name: localDhcpServer
    tf_name: local_dhcp_server
    type: Bool
    ndfc_type: bool
    ndfc_nested:
    - management
    description: Automatic IP assignment for POAP from local DHCP server
    computed: true
  - model_name: dhcpProtocolVersion
    tf_name: dhcp_protocol_version
    type: String
    ndfc_nested:
    - management
    description: IP protocol version for local DHCP server
    computed: true
  - model_name: dhcpStartAddress
    tf_name: dhcp_start_address
    type: String
    ndfc_nested:
    - management
    description: Start address for switch POAP
    computed: true
  - model_name: dhcpEndAddress
    tf_name: dhcp_end_address
    type: String
    ndfc_nested:
    - management
    description: End address for switch POAP
    computed: true
  - model_name: domainName
    tf_name: domain_name
    type: String
    ndfc_nested:
    - management
    description: Domain name for DHCP server PnP block
    computed: true
  - model_name: managementGateway
    tf_name: management_gateway
    type: String
    ndfc_nested:
    - management
    description: Default gateway for management VRF on the switch
    computed: true
  - model_name: managementIpv4Prefix
    tf_name: management_ipv4_prefix
    type: Int64
    ndfc_nested:
    - management
    description: Switch mgmt IP subnet prefix if DHCPv4
    computed: true
  - model_name: managementIpv6Prefix
    tf_name: management_ipv6_prefix
    type: Int64
    ndfc_nested:
    - management
    description: Switch Mgmt IPv6 Subnet Prefix
    computed: true
  - model_name: bootstrapMultiSubnet
    tf_name: bootstrap_multi_subnet
    type: String
    computed: true
    ndfc_nested:
    - management
    description: Enter One Subnet Scope per line. Start_IP, End_IP, Gateway, Prefix
      e.g. 10.6.0.2, 10.6.0.9, 10.6.0.1, 24
  - model_name: bootstrapSubnetCollection
    tf_name: bootstrap_subnet_collection
    type: List
    ndfc_nested:
    - management
    attributes:
    - model_name: startIp
      tf_name: start_ip
      type: String
      description: Start IP address of the bootstrap subnet scope
      computed: true
    - model_name: endIp
      tf_name: end_ip
      type: String
      description: End IP address of the bootstrap subnet scope
      computed: true
    - model_name: defaultGateway
      tf_name: default_gateway
      type: String
      description: Default gateway for the bootstrap subnet scope
      computed: true
    - model_name: subnetPrefix
      tf_name: subnet_prefix
      type: Int64
