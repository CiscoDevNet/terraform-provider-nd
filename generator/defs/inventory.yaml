resource:
  name: inventory_switch
  generate_tf_resource: true
  skip_equality: false
  category: manage
  attributes:
  # Required - Fabric identifier
  - model_name: id
    tf_name: id
    description: Unique identifier for the inventory switch resource
    type: String
    computed: true
    use_state: true
  
  - model_name: fabricName
    tf_name: fabric_name
    description: Name of the fabric to add switches to
    type: String
    mandatory: true
    example: my_fabric

  # Mode selection
  - model_name: mode
    tf_name: mode
    description: Operation mode - discovery (brownfield/greenfield) or bootstrap (POAP)
    type: String
    optional: true
    default_value: discovery
    example: discovery
    tf_requires_replace: true
  
  - model_name: seedIpCollection
    tf_name: seed_ip_collection
    type: List:String
    tf_hide: true

  - &preserveConfig
    model_name: preserveConfig
    tf_name: preserve_config
    description: Preserve existing config (true=brownfield, false=greenfield)
    type: Bool
    ndfc_type: bool
    default_value: false
    tf_requires_replace: true
    example: true
  
  - model_name: wait_for_bootstrap
    tf_name: wait_for_bootstrap
    description: > 
      How long to Wait for the switch to boot into POAP mode (eg. 10m 60s etc)
      When configured, Terraform will allow some time for the switch to boot into POAP mode.
      When not specified, if the switch is not found in the 'POAP' list during the operation, the resource errors out
    type: String
    payload_hide: true

  - model_name: wait_for_discover
    tf_name: wait_for_discover
    description: >
      How long to wait for the switch to become reachable during discovery (eg. 10m 60s etc).
      When configured, Terraform will retry shallow discovery until the switch is reachable or the timeout expires.
      When not specified, if the switch is not reachable, the resource errors out immediately.
    type: String
    payload_hide: true
    example: "10m"

  - model_name: wait_for_ready
    tf_name: wait_for_ready
    type: String
    description: > 
      How long to Wait for the switch to be online after adding to fabric (eg. 10m 60s etc)
      When configured, Terraform will wait an poll the switch to be ready.
      If the switch is not ready within the timeout, the resource errors out.
    default_value: "30m"
    payload_hide: true
    example: "30m"

  # Switches map - key is serial number
  - model_name: switch_detail
    tf_name: switch_detail
    description: A structure containing switch details to manage
    type: Struct
    mandatory: true
    payload_hide: true
    attributes:
    - model_name: hostname
      tf_name: hostname
      description: Switch hostname
      type: String
      use_state: true
      computed: true
      optional: true
    
    - model_name: serialNumber
      tf_name: serial_number
      description: Switch serial number
      type: String
      computed: true
      optional: true
      use_state: true

    - model_name: ip
      tf_name: ip_address
      unmarshal_tag: fabricManagementIp
      description: Switch management IP address
      type: String
      mandatory: true
      example: "10.23.244.81"

    - model_name: model
      tf_name: model
      description: Switch hardware model
      type: String
      computed: true
      optional: true
      use_state: true
      example: N9K-C93180YC-FX

    - model_name: softwareVersion
      tf_name: software_version
      description: Switch software version
      type: String
      computed: true
      optional: true
      use_state: true
      example: "10.3(3)"

    - model_name: softwareImage
      tf_name: software_image
      description: Software image filename for bootstrap (e.g. nxos64-cs.10.3.1.F.bin). When specified, this image is used during POAP bootstrap. When omitted, the value from the bootstrap list API is used.
      type: String
      computed: true
      optional: true
      use_state: true
      example: "nxos64-cs.10.3.1.F.bin"

    - model_name: switchRole
      tf_name: switch_role
      description: Role of switch in fabric.
      type: String
      default_value: leaf
      example: leaf
      enum_values:
        - border
        - borderGateway
        - borderGatewaySpine
        - borderGatewaySuperSpine
        - borderSpine
        - borderSuperSpine
        - leaf
        - spine
        - superSpine
        - tier2Leaf
        - tor
        - access
        - aggregation
        - coreRouter
        - edgeRouter
        - meta
        - neighbor

    - <<: *preserveConfig
      tf_hide: true

    - model_name: status
      tf_name: status
      description: Current switch status
      type: String
      computed: true
      example: Manageable

    - model_name: statusReason
      tf_name: status_reason
      description: Reason for current switch status (e.g., failure details)
      type: String
      computed: true

    # Bootstrap/POAP specific fields
    - model_name: gatewayIpMask
      tf_name: gateway_ip_mask
      description: Gateway IP with mask for POAP (e.g., 10.1.1.1/24)
      type: String
      optional: true
      example: "10.1.1.1/24"

    - model_name: discoveryAuthProtocol
      tf_name: discovery_auth_protocol
      description: Authentication protocol for POAP discovery
      type: String
      optional: true
      example: MD5


    - model_name: vdcId
      tf_name: vdc_id
      description: VDC ID for N7K switches
      type: Int64
      computed: true
      optional: true
      use_state: true
      example: null

    - model_name: vdcMac
      tf_name: vdc_mac
      description: VDC MAC for N7K switches
      type: String
      computed: true
      optional: true
      use_state: true
      example: null

    #below variables are for different APIs

    - model_name: password
      tf_name: switch_password
      description: Password for bootstrap API payload (populated from top-level password)
      type: String
      tf_hide: true

    - model_name: ipAddress
      tf_name: ip_addr_bootstrap
      description: IP address for bootstrap payload
      type: String
      tf_hide: true
    
    - model_name: publicKey
      tf_name: public_key
      description: Public key for bootstrap
      type: String
      tf_hide: true

    - model_name: fingerPrint
      tf_name: fingerprint
      description: Fingerprint for bootstrap
      type: String
      tf_hide: true

    - model_name: inInventory
      tf_name: in_inventory
      description: Whether the switch is in inventory
      type: Bool
      ndfc_type: bool
      tf_hide: true

  - model_name: username
    tf_name: discovery_username
    description: >
      Username for switch discovery/login.
      In discovery mode, used as the switch login username.
      In bootstrap mode with use_new_credentials enabled, used as the post-bootstrap discovery username.
    type: String
    optional: true
    sensitive: true
    use_state: true
    example: admin

  - model_name: password
    tf_name: discovery_password
    description: >
      Password for switch discovery/login.
      In discovery mode, used as the switch login password.
      In bootstrap mode with use_new_credentials enabled, used as the post-bootstrap discovery password.
    type: String
    optional: true
    sensitive: true
    use_state: true
    example: mysecret

  - model_name: bootstrap_password
    tf_name: bootstrap_password
    description: >
      Admin password to set on the switch during POAP bootstrap.
      Required for bootstrap mode. Not used in discovery mode.
    type: String
    optional: true
    sensitive: true
    use_state: true
    payload_hide: true

  - model_name: use_new_credentials
    tf_name: use_new_credentials
    description: >
      Bootstrap mode only. When true, use discovery_username and discovery_password
      as separate credentials for post-bootstrap switch discovery.
      When false, the bootstrap admin password is used for discovery.
    type: Bool
    ndfc_type: bool
    optional: true
    default_value: false
    payload_hide: true

  - model_name: discovery_cred_for_lan
    tf_name: discovery_cred_for_lan
    description: >
      Discovery mode only. When true, use the discovery credentials as LAN
      credentials for config deployment (write) to the switch.
    type: Bool
    ndfc_type: bool
    default_value: true
    payload_hide: true

  - model_name: platformType
    tf_name: platform_type
    description: Platform type (nx-os, ios-xe)
    type: String
    computed: true

  - model_name: snmpV3AuthProtocol
    tf_name: snmp_v3_auth_protocol
    description: SNMP v3 authentication protocol
    type: String
    default_value: md5
    example: md5

  # Credential store
  - model_name: remoteCredentialStore
    tf_name: remote_credential_store
    description: Credential store type (local, cyberark)
    type: String
    optional: true
    default_value: local
    example: local

  - model_name: remoteCredentialStoreKey
    tf_name: remote_credential_store_key
    description: Key for remote credential store
    type: String
    optional: true
    example: null

  # Discovery source interface and VRF (update-only, read from additionalData)
  - model_name: sourceInterfaceName
    tf_name: source_interface_name
    description: Source interface for switch discovery
    type: String
    optional: true
    payload_hide: true

  - model_name: sourceVrfName
    tf_name: source_vrf_name
    description: Source VRF for switch discovery
    type: String
    optional: true
    payload_hide: true

  # Discovery settings
  - model_name: maxHop
    tf_name: max_hop
    description: Maximum hops for CDP/LLDP discovery
    type: Int64
    tf_hide: true
