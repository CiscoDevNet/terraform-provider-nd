resource:
  name: multi_cluster_connectivity
  generate_tf_resource: true
  skip_equality: true
  category: infra
  attributes:
  - model_name: clusterType
    tf_name: cluster_type
    description: The type of the cluster. The value will be auto filled as "ND" for this resource.
    type: String
    computed: true
    ndfc_nested:
    - spec
    example: ND

  - model_name: name
    tf_name: cluster_name
    description: The name of the ND cluster.
    type: String
    optional: true
    computed: true
    use_state: true
    ndfc_nested:
    - spec
    example: nd4x

  - model_name: onboardUrl
    tf_name: hostname
    description: The IP address or Hostname of the ND cluster.
    type: String
    mandatory: true
    tf_requires_replace: true
    ndfc_nested:
    - spec
    example: 10.15.1.111

  - model_name: user
    tf_name: username
    description: The username of the ND cluster.
    type: String
    mandatory: true
    sensitive: true
    ndfc_nested:
    - spec
    - credentials
    example: username

  - model_name: password
    tf_name: password
    description: The password of the ND cluster.
    type: String
    mandatory: true
    sensitive: true
    ndfc_nested:
    - spec
    - credentials
    example: password

  - model_name: loginDomain
    tf_name: login_domain
    description: The login domain of the ND cluster. The login domain is used during the connection of clusters to specify the authentication domain for the remote clusters.
    type: String
    computed: true
    optional: true
    use_state: true
    sensitive: true
    ndfc_nested:
    - spec
    - credentials
    example: local

  - model_name: multiClusterLoginDomainName
    tf_name: multi_cluster_login_domain
    description: The multi-cluster login domain is created on the primary cluster and can be configured either during initial onboarding or manually at a later time. Each primary cluster supports only one login domain of type Multi-cluster. This domain enables the primary cluster to function as the shared authentication authority for the multi-cluster group, allowing users defined on the primary cluster to remotely log in to any connected cluster.
    type: String
    use_state: true
    optional: true
    computed: true
    sensitive: true
    ndfc_nested:
    - spec
    - nd
    example: multi_cluster_login_domain
