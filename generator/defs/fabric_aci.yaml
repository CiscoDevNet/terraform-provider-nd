resource:
  name: fabric_aci
  generate_tf_resource: true
  skip_equality: true
  category: manage
  doc_category: Fabric Management
  description: |
    Manages Fabric ACI for Nexus Dashboard.

    `<FABRIC_PREFIX>_FORCE` controls forced fabric removal during `terraform destroy` and defaults to `false`. Set it to `true` only when the APIC cluster is unhealthy or unreachable and normal removal cannot complete. Before using forced removal, remove the fabric from deployed templates and ensure that it is no longer used by Nexus Dashboard services.

    Environment variable names use the uppercase `fabric_name` with hyphens replaced by underscores. For example, `fabric_name = "tf-apic1"` uses `TF_APIC1_FORCE`. To request forced removal, run `TF_APIC1_FORCE=true terraform destroy`.

  attributes:
  - model_name: id
    tf_name: id
    description: The unique identifier for the resource, it is the name of the fabric aci (for example, apic1).
    type: String
    computed: true
    id: true
    use_state: true
    payload_hide: true

  - model_name: clusterType
    tf_name: cluster_type
    description: The type of the cluster. The value will be auto filled as "APIC" for this resource.
    type: String
    default_value: APIC
    tf_hide: true
    ndfc_nested:
    - spec

  - model_name: onboardUrl
    tf_name: hostname
    description: The IP address or hostname of the APIC cluster. Do not include the protocol (`http://` or `https://`) in the value.
    type: String
    mandatory: true
    validator: 'RegexMatches(regexp.MustCompile(`^[^/]+$`), "must be an IP address or hostname without http:// or https://")'
    tf_requires_replace: true
    ndfc_nested:
    - spec
    example: 1.1.1.1

  - model_name: latitude
    tf_name: latitude
    description: The latitude coordinate of the APIC cluster.
    type: Float64
    optional: true
    ndfc_nested:
    - spec
    - location
    example: 37.3

  - model_name: longitude
    tf_name: longitude
    description: The longitude coordinate of the APIC cluster.
    type: Float64
    optional: true
    ndfc_nested:
    - spec
    - location
    example: -121.8

  - model_name: user
    tf_name: username
    description: The APIC username. The API does not return this value during import, so set `<FABRIC_PREFIX>_USERNAME` to store it in state. If unset during import, run `terraform apply` before destroy.
    type: String
    mandatory: true
    sensitive: true
    ndfc_nested:
    - spec
    - credentials
    example: admin

  - model_name: password
    tf_name: password
    description: The APIC password. The API does not return this value during import, so set `<FABRIC_PREFIX>_PASSWORD` to store it in state. If unset during import, run `terraform apply` before destroy.
    type: String
    mandatory: true
    sensitive: true
    ndfc_nested:
    - spec
    - credentials
    example: "**********"

  - model_name: loginDomain
    tf_name: login_domain
    description: The APIC login domain. The API does not return this value during import, so set `<FABRIC_PREFIX>_LOGIN_DOMAIN` to store it in state. If unset during import, run `terraform apply` before destroy when the configured login domain is required.
    type: String
    optional: true
    sensitive: true
    ndfc_nested:
    - spec
    - credentials
    example: DefaultAuth

  - model_name: name
    tf_name: fabric_name
    description: The name of the APIC cluster.
    type: String
    mandatory: true
    validator: 'RegexMatches(regexp.MustCompile(`^[a-zA-Z0-9]([a-zA-Z0-9-]{0,62}[a-zA-Z0-9])?$`), "must start and end with an alphanumeric character, contain only letters, digits, or hyphens, and be no more than 64 characters")'
    tf_requires_replace: true
    ndfc_nested:
    - spec
    - aci
    example: apic1

  - model_name: licenseTier
    tf_name: license_tier
    description: The license tier of the APIC cluster. Allowed values are `essentials`, or `advantage`, or `premier`.
    type: String
    optional: true
    ndfc_nested:
    - spec
    - aci
    validator: 'OneOf("essentials", "advantage", "premier")'
    example: premier

  - model_name: telemetry
    tf_name: telemetry
    description: Configures telemetry collection for the APIC cluster.
    type: Struct
    optional: true
    ndfc_nested:
    - spec
    - aci
    attributes:
    - model_name: status
      tf_name: status
      description: The status of telemetry collection for the APIC cluster. Allowed values are `enabled` or `disabled`. Defaults to `disabled` when not specified in the configuration.
      type: String
      computed: true
      example: enabled

    - model_name: network
      tf_name: network
      description: The network type for telemetry collection. Allowed values are `inband` or `outband`. Defaults to `inband` when not specified in the configuration.
      type: String
      default_value: inband
      validator: 'OneOf("inband", "outband")'
      example: inband

    - model_name: epg
      tf_name: epg
      description: The APIC End Point Group (EPG) Distinguished Name (DN) used by `inband` telemetry.
      type: String
      optional: true
      example: uni/tn-tf_tenant/ap-tf_ap/epg-tf_epg

    - model_name: streamingProtocol
      tf_name: streaming_protocol
      description: The streaming protocol used for telemetry collection. Allowed values are `ipv4` or `ipv6`. Defaults to `ipv4` when not specified in the configuration.
      type: String
      default_value: ipv4
      validator: 'OneOf("ipv4", "ipv6")'
      example: ipv4

  - model_name: status
    tf_name: orchestration_status
    description: The status of the orchestration feature for the APIC cluster. Allowed values are `enabled` or `disabled`. Defaults to `disabled` when not specified in the configuration.
    type: String
    default_value: disabled
    ndfc_nested:
    - spec
    - aci
    - orchestration
    example: disabled
    validator: 'OneOf("enabled", "disabled")'

  - model_name: securityDomain
    tf_name: security_domain
    description: The name of the security domain for the APIC cluster. Defaults to `all` when not specified in the configuration.
    type: String
    default_value: all
    ndfc_nested:
    - spec
    - aci
    example: all

  # The verify_ca is used only during creation and is not returned by the API. Therefore, default it to false in the Create and Import functions when its value is null or unknown.
  - model_name: verifyCA
    tf_name: verify_ca
    description: This validates that connected host certificates are signed by a trusted Certificate Authority (CA). Defaults to `false` when not specified in the configuration.
    type: Bool
    ndfc_type: bool
    optional: true
    computed: true
    ndfc_nested:
    - spec
    - aci
    example: false

  - model_name: state
    tf_name: state
    description: The state of the APIC cluster.
    type: String
    computed: true
    use_state: true
    payload_hide: true
    ndfc_nested:
    - status

  - model_name: message
    tf_name: last_update_message
    description: The last update message of the APIC cluster.
    type: String
    computed: true
    use_state: true
    payload_hide: true
    ndfc_nested:
    - status
    - lastUpdate
