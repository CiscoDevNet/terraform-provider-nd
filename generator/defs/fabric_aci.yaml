resource:
  name: fabric_aci
  generate_tf_resource: true
  skip_equality: true
  category: manage
  doc_category: Fabric Management
  description: |
    Manages Fabric ACI for Nexus Dashboard.

    Environment variables use the uppercase `fabric_name` with hyphens replaced by underscores as the prefix; for example, `tf-apic1` becomes `TF_APIC1`. `<FABRIC_PREFIX>_FORCE` is a Boolean for forced destroy (default: `false`).
  attributes:
  - model_name: id
    tf_name: id
    description: The unique identifier for the resource, it is the name of the fabric aci (for example, apic1).
    type: String
    computed: true
    id: true
    use_state: true
    payload_hide: true

  - model_name: clusterType
    tf_name: cluster_type
    description: The type of the cluster. The value will be auto filled as "APIC" for this resource.
    type: String
    default_value: APIC
    tf_hide: true
    ndfc_nested:
    - spec

  - model_name: onboardUrl
    tf_name: hostname
    description: The IP address or hostname of the APIC cluster. Do not include the protocol (`http://` or `https://`) in the value.
    type: String
    mandatory: true
    validator: 'RegexMatches(regexp.MustCompile(`^[^/]+$`), "must be an IP address or hostname without http:// or https://")'
    tf_requires_replace: true
    ndfc_nested:
    - spec
    example: 1.1.1.1

  - model_name: latitude
    tf_name: latitude
    description: The latitude coordinate of the APIC cluster.
    type: Float64
    optional: true
    computed: true
    ndfc_nested:
    - spec
    - location
    example: 37.3

  - model_name: longitude
    tf_name: longitude
    description: The longitude coordinate of the APIC cluster.
    type: Float64
    optional: true
    computed: true
    ndfc_nested:
    - spec
    - location
    example: -121.8

  - model_name: user
    tf_name: username
    description: The APIC username. The API does not return this value during import, so set `<FABRIC_PREFIX>_USERNAME` to store it in state. If unset during import, run `terraform apply` before destroy.
    type: String
    mandatory: true
    sensitive: true
    ndfc_nested:
    - spec
    - credentials
    example: admin

  - model_name: password
    tf_name: password
    description: The APIC password. The API does not return this value during import, so set `<FABRIC_PREFIX>_PASSWORD` to store it in state. If unset during import, run `terraform apply` before destroy.
    type: String
    mandatory: true
    sensitive: true
    ndfc_nested:
    - spec
    - credentials
    example: "**********"

  - model_name: loginDomain
    tf_name: login_domain
    description: The APIC login domain. The API does not return this value during import, so set `<FABRIC_PREFIX>_LOGIN_DOMAIN` to store it in state. If unset during import, run `terraform apply` before destroy when the configured login domain is required.
    type: String
    optional: true
    computed: true
    sensitive: true
    ndfc_nested:
    - spec
    - credentials
    example: DefaultAuth

  - model_name: name
    tf_name: fabric_name
    description: The name of the APIC cluster.
    type: String
    mandatory: true
    tf_requires_replace: true
    ndfc_nested:
    - spec
    - aci
    example: apic1

  - model_name: licenseTier
    tf_name: license_tier
    description: The license tier of the APIC cluster. Allowed values are `essentials`, or `advantage`, or `premier`.
    type: String
    optional: true
    computed: true
    ndfc_nested:
    - spec
    - aci
    validator: 'OneOf("essentials", "advantage", "premier")'
    example: premier

  - model_name: status
    tf_name: telemetry_status
    description: The status of telemetry collection for the APIC cluster. Allowed values are `enabled` or `disabled`. Defaults to `disabled` when unset during creation.
    type: String
    optional: true
    computed: true
    default_value: disabled
    ndfc_nested:
    - spec
    - aci
    - telemetry
    validator: 'OneOf("enabled", "disabled")'
    example: disabled

  - model_name: network
    tf_name: telemetry_network
    description: The network type for telemetry collection. Allowed values are `inband` or `outband`.
    type: String
    optional: true
    computed: true
    ndfc_nested:
    - spec
    - aci
    - telemetry
    validator: 'OneOf("inband", "outband")'

  - model_name: epg
    tf_name: telemetry_epg
    description: The APIC End Point Group (EPG) Distinguished Name (DN) used by `inband` telemetry.
    type: String
    optional: true
    computed: true
    ndfc_nested:
    - spec
    - aci
    - telemetry

  - model_name: streamingProtocol
    tf_name: telemetry_streaming_protocol
    description: The streaming protocol used for telemetry collection. Allowed values are `ipv4` or `ipv6`. Defaults to `ipv4` when unset during creation.
    type: String
    optional: true
    computed: true
    ndfc_nested:
    - spec
    - aci
    - telemetry
    validator: 'OneOf("ipv4", "ipv6")'

  - model_name: status
    tf_name: orchestration_status
    description: The status of the orchestration feature for the APIC cluster. Allowed values are `enabled` or `disabled`. Defaults to `disabled` when unset during creation.
    type: String
    optional: true
    computed: true
    default_value: disabled
    ndfc_nested:
    - spec
    - aci
    - orchestration
    example: disabled
    validator: 'OneOf("enabled", "disabled")'

  - model_name: securityDomain
    tf_name: security_domain
    description: The name of the security domain for the APIC cluster. Defaults to `all` when unset during creation.
    type: String
    optional: true
    computed: true
    default_value: all
    ndfc_nested:
    - spec
    - aci
    example: all

  - model_name: verifyCA
    tf_name: verify_ca
    description: This validates that connected host certificates are signed by a trusted Certificate Authority (CA). Defaults to `false` when not specified in the configuration.
    type: Bool
    ndfc_type: bool
    default_value: false
    ndfc_nested:
    - spec
    - aci
    example: false

  - model_name: state
    tf_name: state
    description: The state of the APIC cluster.
    type: String
    computed: true
    use_state: true
    payload_hide: true
    ndfc_nested:
    - status

  - model_name: message
    tf_name: last_update_message
    description: The last update message of the APIC cluster.
    type: String
    computed: true
    use_state: true
    payload_hide: true
    ndfc_nested:
    - status
    - lastUpdate